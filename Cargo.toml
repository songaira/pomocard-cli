[package]
name = "pomocard-cli"
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
description = "Pomocard TUI — a strictly monochrome terminal wrapper around the Pomocard focus workspace (Pomodoro + Kanban), built with ratatui."
license = "MIT"
readme = "README.md"

[[bin]]
name = "pomocard"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
opt-level = 3

